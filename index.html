<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;font:14px system-ui}</style></head><body>
<title>Midgard Fields</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800&family=Pixelify+Sans:wght@500;700&display=swap">
<style>
/* Layout concept: a slim title bar over one framed game window. Classic blue-titled 2003-style windows float over a daylight field. Deliberately a single look (no dark theme): the game world is always daylight. */
:root{
  --page:#1c2742; --page-2:#2a3b66; --ink:#1d2740; --ink-soft:#52607f;
  --win:#f1f5fc; --win-2:#dde7f6; --line:#8aa5d3; --title-a:#6b98da; --title-b:#335fa6;
  --gold:#f2b632; --gold-2:#ffe08a; --hp:#e0525a; --sp:#3f86e0; --exp:#f0b22e;
  --ok:#4fb06a; --danger:#d9444e; --field:#8cc668;
  --f-display:'Pixelify Sans','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Nunito','Segoe UI',Tahoma,system-ui,sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{
  margin:0;background:var(--page);color:var(--ink);font:14px/1.4 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:10px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;overflow:hidden;
  user-select:none;-webkit-user-select:none;
}
#bar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:0}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand h1{margin:0;font:700 22px/1 var(--f-display);color:#fff;letter-spacing:.5px;white-space:nowrap;text-shadow:0 2px 0 #12192e}
.brand span{color:#9fb2d8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#menu{display:flex;gap:6px;flex-shrink:0}
.mbtn{position:relative;display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:5px;
  background:linear-gradient(#fff,var(--win-2));color:var(--ink);font:800 12px var(--f-body);cursor:pointer}
.mbtn:hover{background:linear-gradient(#fff,#cfdcf1)}
.mbtn.on{background:linear-gradient(var(--gold-2),var(--gold))}
.mbtn kbd{font:700 10px var(--f-body);background:#fff;border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--ink-soft)}
.dot{display:none;width:9px;height:9px;border-radius:50%;background:var(--danger);border:1.5px solid #fff;position:absolute;top:-4px;right:-4px;animation:pulse 1.2s infinite}
.dot.show{display:block}
@keyframes pulse{50%{transform:scale(1.35)}}
#stage{position:relative;flex:1;min-height:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:var(--field);touch-action:none;
  box-shadow:0 10px 30px rgba(5,10,25,.45)}
#stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 45%,transparent 55%,rgba(14,24,50,.28))}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;z-index:2}
.win{background:var(--win);border:1px solid var(--line);border-radius:6px;box-shadow:0 2px 0 rgba(31,51,92,.25),0 8px 18px rgba(14,24,48,.28);overflow:hidden}
.wt{background:linear-gradient(var(--title-a),var(--title-b));color:#fff;font:700 12px var(--f-display);padding:3px 8px;letter-spacing:.4px;display:flex;justify-content:space-between;align-items:center}
.wb{padding:6px 8px;display:flex;flex-direction:column;gap:4px}
#lcol{position:absolute;left:8px;top:8px;width:196px;display:flex;flex-direction:column;gap:6px}
.nm{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;font-size:12.5px}
.nm small{font-weight:700;color:var(--ink-soft)}
.bar{position:relative;height:15px;background:#c9d4e8;border:1px solid #7f95bd;border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;width:0}
.bar b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:800 10.5px var(--f-body);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.65)}
.bar.hp i{background:linear-gradient(#f58a90,var(--hp))}
.bar.sp i{background:linear-gradient(#7db2f2,var(--sp))}
.bar.xp i{background:linear-gradient(#f9d56e,#e6a21a)}
.bar.xp{height:11px}.bar.xp b{font-size:9.5px}
.zeny{display:flex;justify-content:space-between;font-weight:800;font-size:12px;color:var(--ink-soft)}
.zeny b{color:#a8730a}
#mini{position:absolute;right:8px;top:8px;width:140px;height:90px;border:2px solid var(--line);border-radius:5px;background:#243a2a;box-shadow:0 6px 14px rgba(10,20,40,.35)}
#banner{position:absolute;left:50%;top:20%;transform:translateX(-50%);text-align:center;color:#fff;opacity:0;transition:opacity .5s;pointer-events:none;
  text-shadow:0 2px 0 #12192e,0 0 12px rgba(0,0,0,.5)}
#banner.show{opacity:1}
#banner b{display:block;font:700 26px var(--f-display);letter-spacing:.5px}
#banner span{font:700 12px var(--f-body);color:#ffe9a8}
#log{position:absolute;left:8px;bottom:104px;width:min(400px,calc(100% - 16px));display:flex;flex-direction:column;gap:1px;font-size:12px;font-weight:700;pointer-events:none}
.ln{padding:1px 6px;border-radius:3px;background:rgba(14,24,48,.42);text-shadow:0 1px 0 #000;width:fit-content;max-width:100%;animation:lnfade 16s forwards}
@keyframes lnfade{0%,78%{opacity:1}100%{opacity:0}}
.ln.sys{color:#fff}.ln.exp{color:#b6f08a}.ln.drop{color:#8fe3ff}.ln.bad{color:#ff9b9b}.ln.lvl{color:#ffd966}.ln.gold{color:#ffdf8a}
#dock{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none}
#toggles{display:flex;gap:6px}
.chip{pointer-events:auto;cursor:pointer;font:800 11px var(--f-body);padding:2px 9px;border-radius:11px;border:1px solid var(--line);background:rgba(241,245,252,.92);color:var(--ink-soft)}
.chip.on{background:var(--ok);border-color:#2f8049;color:#fff}
#hotbar{display:flex;gap:5px;padding:5px;background:rgba(241,245,252,.9);border:1px solid var(--line);border-radius:7px;pointer-events:auto;box-shadow:0 6px 14px rgba(10,20,40,.3)}
.slot{position:relative;width:46px;height:46px;border:1px solid #6f8fc4;border-radius:5px;background:linear-gradient(#fff,#d3e0f4);cursor:pointer;padding:0;overflow:hidden;font-family:var(--f-body)}
.slot:hover{border-color:var(--gold)}
.slot .ic{position:absolute;inset:7px 7px 7px 7px;display:flex;align-items:center;justify-content:center}
.slot .ic svg{width:100%;height:100%}
.slot .k{position:absolute;left:3px;top:1px;font:800 10px var(--f-body);color:var(--ink-soft);z-index:2}
.slot .q{position:absolute;right:3px;bottom:1px;font:800 10px var(--f-body);color:var(--ink);z-index:2;text-shadow:0 0 2px #fff,0 0 2px #fff}
.slot .cd{position:absolute;left:0;right:0;bottom:0;height:0;background:rgba(20,35,70,.55);z-index:1}
.slot.off .ic{opacity:.35;filter:grayscale(1)}
#target{display:none}
#target.show{display:block}
#panel{position:absolute;z-index:5;display:none;flex-direction:column;top:8px;right:8px;bottom:8px;width:340px;pointer-events:auto}
#panel.open{display:flex}
.tabs{display:flex;gap:3px;padding:5px 6px 0;background:var(--win-2);border-bottom:1px solid var(--line)}
.tab{flex:1;padding:5px 4px;border:1px solid var(--line);border-bottom:none;border-radius:5px 5px 0 0;background:#e9f0fb;font:800 12px var(--f-body);color:var(--ink-soft);cursor:pointer;position:relative}
.tab.on{background:var(--win);color:var(--ink)}
.tab .dot{top:-3px;right:-3px}
.pbody{flex:1;overflow:auto;padding:8px;min-height:0;-webkit-overflow-scrolling:touch}
.x{background:none;border:none;color:#fff;font:700 16px var(--f-body);cursor:pointer;padding:0 2px;line-height:1}
.sect{font:700 12px var(--f-display);color:var(--title-b);margin:8px 0 3px;padding-bottom:2px;border-bottom:2px solid var(--win-2);letter-spacing:.4px}
.sect:first-child{margin-top:0}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:8px;align-items:center;padding:5px 2px;border-bottom:1px dashed var(--win-2)}
.ric{width:30px;height:30px;background:#fff;border:1px solid var(--win-2);border-radius:4px;display:flex;align-items:center;justify-content:center}
.ric svg{width:24px;height:24px}
.rin{min-width:0;display:flex;flex-direction:column}
.rin b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rin span{font-size:11.5px;color:var(--ink-soft);line-height:1.25}
.rac{display:flex;flex-direction:column;gap:3px;align-items:flex-end}
.rac .pr{font:800 12px var(--f-body);color:#a8730a}
.rac .bt{display:flex;gap:4px}
.btn{font:800 11.5px var(--f-body);padding:3px 8px;border:1px solid #6f8fc4;border-radius:4px;background:linear-gradient(#fff,#d6e3f6);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover:not(:disabled){background:linear-gradient(#fff,#c4d6f1)}
.btn.pri{background:linear-gradient(var(--gold-2),var(--gold));border-color:#b98516}
.btn.bad{background:linear-gradient(#ffd0d3,#f08e95);border-color:#b8434b}
.btn:disabled{opacity:.42;cursor:default}
.mut{color:var(--ink-soft);font-weight:600}
.warn{color:var(--danger);font-weight:800}
.card{background:#fff;border:1px solid var(--win-2);border-radius:5px;padding:8px;margin-bottom:6px}
.stat{display:grid;grid-template-columns:42px 30px minmax(0,1fr) auto;gap:6px;align-items:center;padding:4px 0;border-bottom:1px dashed var(--win-2)}
.stat b{font:700 13px var(--f-display);color:var(--title-b)}
.stat em{font-style:normal;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--ink-soft)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.grid2 div{display:flex;justify-content:space-between;font-size:12.5px;border-bottom:1px dotted var(--win-2);padding:1px 0}
.grid2 div b{font-variant-numeric:tabular-nums}
.pts{display:flex;justify-content:space-between;align-items:center;font-weight:800;margin-bottom:6px}
.pts b{background:var(--gold);padding:1px 9px;border-radius:10px;border:1px solid #b98516}
.pips{display:flex;gap:2px;margin:2px 0}
.pips i{width:12px;height:6px;border-radius:2px;background:#cdd8ea;border:1px solid #9fb2d3}
.pips i.f{background:var(--ok);border-color:#2f8049}
.tag{font:800 9.5px var(--f-body);padding:0 5px;border-radius:3px;margin-left:5px;vertical-align:1px;letter-spacing:.3px}
.tag.a{background:#ffe1c9;color:#a4510f}.tag.p{background:#d6ecd9;color:#2a6b3e}
.seg{display:flex;gap:4px;margin:6px 0}
.seg .btn{flex:1}
.seg .btn.on{background:linear-gradient(var(--gold-2),var(--gold));border-color:#b98516}
.greet{background:#fff7e0;border:1px solid #ecd48c;border-radius:5px;padding:6px 8px;font-size:12.5px;margin-bottom:4px}
.foot{margin-top:12px;display:flex;justify-content:flex-end}
#dead{position:absolute;inset:0;z-index:8;display:none;align-items:center;justify-content:center;background:rgba(10,16,32,.6)}
#dead.show{display:flex}
#dead div{background:var(--win);border:1px solid var(--line);border-radius:8px;padding:18px 22px;text-align:center;max-width:300px;box-shadow:0 12px 30px rgba(0,0,0,.5)}
#dead h2{margin:0 0 4px;font:700 22px var(--f-display);color:var(--danger)}
#dead p{margin:0 0 10px;color:var(--ink-soft)}
:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
@media (max-width:719px){
  .brand span{display:none}
  .brand h1{font-size:18px}
  #lcol{width:166px}
  #mini{width:112px;height:72px}
  #panel{top:auto;left:0;right:0;bottom:0;width:auto;max-height:66%;border-radius:10px 10px 0 0}
  .mbtn kbd{display:none}
  .mbtn{padding:5px 8px}
  #log{bottom:98px;font-size:11px}
  .slot{width:42px;height:42px}
  #banner b{font-size:21px}
}
@media (hover:none){.mbtn kbd{display:none}}
@media (prefers-reduced-motion:reduce){.dot{animation:none}.ln{animation:none}}
</style>

<header id="bar">
  <div class="brand"><h1>Midgard Fields</h1><span>A 2003-style field RPG</span></div>
  <nav id="menu">
    <button class="mbtn" data-tab="items" id="mb-items">Items <kbd>I</kbd></button>
    <button class="mbtn" data-tab="status" id="mb-status">Status <kbd>C</kbd><i class="dot" id="dot-status"></i></button>
    <button class="mbtn" data-tab="skills" id="mb-skills">Skills <kbd>K</kbd><i class="dot" id="dot-skills"></i></button>
  </nav>
</header>
<main id="stage">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div id="lcol">
      <section class="win" id="basic">
        <div class="wt"><span>Basic Info</span><span id="b-job">Swordsman</span></div>
        <div class="wb">
          <div class="nm"><span id="b-name">Hero</span><small id="b-lv">Base Lv. 1</small></div>
          <div class="bar hp"><i id="b-hpf"></i><b id="b-hpt"></b></div>
          <div class="bar sp"><i id="b-spf"></i><b id="b-spt"></b></div>
          <div class="bar xp"><i id="b-xpf"></i><b id="b-xpt"></b></div>
          <div class="zeny"><span>Zeny</span><b id="b-z">0 z</b></div>
        </div>
      </section>
      <section class="win" id="target">
        <div class="wt"><span id="t-name">Slime</span><span id="t-lv">Lv. 1</span></div>
        <div class="wb"><div class="bar hp"><i id="t-hpf"></i><b id="t-hpt"></b></div></div>
      </section>
    </div>
    <canvas id="mini" width="280" height="180"></canvas>
    <div id="banner"></div>
    <div id="log"></div>
    <div id="dock">
      <div id="toggles">
        <button class="chip" data-opt="skill" title="Use skills automatically during fights">Auto skills</button>
        <button class="chip" data-opt="loot" title="Pick up nearby drops automatically">Auto loot</button>
        <button class="chip" data-opt="potion" title="Drink a potion when HP falls below 35%">Auto potion</button>
      </div>
      <div id="hotbar"></div>
    </div>
  </div>
  <aside id="panel" class="win" aria-label="Menu">
    <div class="wt"><span id="p-title">Items</span><button class="x" data-act="close" aria-label="Close">&times;</button></div>
    <div class="tabs" id="tabs"></div>
    <div class="pbody" id="pbody"></div>
  </aside>
  <div id="dead"><div><h2>You fell in battle</h2><p>Your wounds are being tended in Midgard Town.</p><button class="btn pri" id="reviveBtn">Return to town</button></div></div>
</main>

<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.random()*(b-a);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
const fmt=n=>Math.round(n).toLocaleString('en-US');
const mulberry=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const OUT='#2b3148';

/* ---------------- icons ---------------- */
const IC={
 potion:c=>`<path d="M9.5 3h5v3.2l3.6 5.6v8a2.2 2.2 0 0 1-2.2 2.2H8.1a2.2 2.2 0 0 1-2.2-2.2v-8L9.5 6.2z" fill="#eef4fb" stroke="${OUT}" stroke-width="1.4" stroke-linejoin="round"/><path d="M6 14h12v5.8a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2z" fill="${c}"/><rect x="8.8" y="1.6" width="6.4" height="2.8" rx="1" fill="#c79a5e" stroke="${OUT}" stroke-width="1.2"/>`,

}

function spawnPos(zone,farFromPlayer){
  const[x0,x1]=ZRECT[zone];
  for(let i=0;i<60;i++){
    const x=x0+Math.random()*(x1-x0),y=150+Math.random()*(H-300);
    if(obst.some(o=>Math.hypot(o.x-x,o.y-y)<o.r+26))continue;
    if(farFromPlayer&&Math.hypot(x-P.x,y-P.y)<320)continue;
    return{x,y};
  }
  return{x:(x0+x1)/2,y:H/2};
}
function makeMon(key){
  const T=MON[key],p=spawnPos(T.zone,false);
  return{k:'mon',id:monId++,key,t:T,x:p.x,y:p.y,hx:p.x,hy:p.y,hp:T.hp,maxHp:T.hp,state:'idle',wanderT:Math.random()*3,dest:null,
    face:Math.random()<.5?-1:1,moving:false,atkT:1,flash:0,ph:Math.random()*6.28,deadT:0,atkAnim:0};
}
function initMons(){mons.length=0;for(const k in MON)for(let i=0;i<MON[k].count;i++)mons.push(makeMon(k))}

/* ---------------- ui helpers ---------------- */
const logEl=$('#log');
function log(t,c){
  const d=document.createElement('div');d.className='ln '+(c||'sys');d.textContent=t;logEl.appendChild(d);
  while(logEl.children.length>6)logEl.removeChild(logEl.firstChild);
}
const ui={open:false,tab:'items',shop:false,shopTab:'buy',confirmReset:false,dirty:true,last:0};
function dirty(){ui.dirty=true;saveDirty=true}
function floatText(x,y,text,col,size,crit){floats.push({x,y,text,col,size:size||15,t:0,dur:crit?1.2:.95,vx:(Math.random()-.5)*14})}
function addFx(o){o.t=0;fx.push(o)}

/* ---------------- combat ---------------- */
function giveExp(n){
  if(S.level>=CAP)return;
  S.exp+=n;
  while(S.level<CAP&&S.exp>=need(S.level)){
    S.exp-=need(S.level);S.level++;S.statPts+=4;S.skillPts+=1;
    const d=D();S.hp=d.maxHp;S.sp=d.maxSp;
    log(`Base level up! You are now Lv. ${S.level}.`,'lvl');
    log('You gained 4 status points and 1 skill point.','lvl');
    floatText(P.x,P.y-60,'LEVEL UP!','#ffd966',20,true);
    addFx({k:'pillar',x:P.x,y:P.y,dur:1.1});addFx({k:'ring',x:P.x,y:P.y,dur:.9,r:70,col:'#ffd966'});
  }
  if(S.level>=CAP)S.exp=0;
  dirty();
}
function wake(m){if(m.state!=='chase'&&m.state!=='dead')m.state='chase'}
function hitMonster(m,d,o){
  o=o||{};const T=m.t;P.combatT=0;
  const ch=clamp(80+d.hit+(o.hitBonus||0)-T.flee,35,100)/100;
  if(Math.random()>ch){floatText(m.x,m.y-T.h-6,'Miss','#dfe6f5',13);wake(m);return false}
  const crit=!o.noCrit&&Math.random()*100<d.crit;
  let dmg=rnd(d.atk*.9,d.atk*1.1)*(o.mult||1);
  const dr=T.def*2;
  dmg=crit?dmg*1.4:dmg*(1-dr/(dr+40));
  dmg=Math.max(1,Math.round(dmg));
  m.hp-=dmg;m.flash=.14;wake(m);
  floatText(m.x,m.y-T.h-6,crit?dmg+'!':String(dmg),crit?'#ffd54a':(o.col||'#fff'),crit?21:16,crit);
  addFx({k:'spark',x:m.x,y:m.y-T.h/2,dur:.2});
  const a=Math.atan2(m.y-P.y,m.x-P.x),kb=o.knock||3;m.x+=Math.cos(a)*kb;m.y+=Math.sin(a)*kb;
  if(m.hp<=0){m.hp=0;killMonster(m)}
  return true;
}
function rollDrops(m){
  const luk=1+S.stats.luk*.01;
  for(const[id,ch]of m.t.drops){
    if(Math.random()<Math.min(.95,ch*luk))drops.push({k:'drop',id,x:m.x+rnd(-20,20),y:m.y+rnd(-8,16),t:0,hop:rnd(0,1)});
  }
}
function killMonster(m){
  const T=m.t;m.state='dead';m.deadT=0;S.kills++;
  if(P.target===m)P.target=null;
  let e=T.exp;const diff=S.level-T.lvl;
  if(diff>3)e=Math.max(1,Math.round(e*Math.max(.2,1-.18*(diff-3))));
  log(`${T.name} defeated. +${e} Base Exp`,'exp');
  rollDrops(m);giveExp(e);
}
function die(){
  P.dead=true;P.deadT=0;P.target=null;P.dest=null;P.pickup=null;P.npc=false;
  log('You have been defeated...','bad');
  $('#dead').classList.add('show');
}
function respawnPlayer(){
  P.dead=false;P.x=SPAWN.x;P.y=SPAWN.y;
  const d=D();S.hp=Math.ceil(d.maxHp*.5);S.sp=Math.ceil(d.maxSp*.5);
  $('#dead').classList.remove('show');
  for(const m of mons)if(m.state==='chase')m.state='return';
  log('You were carried back to Midgard Town.','sys');dirty();
}
function monAttack(m){
  const T=m.t,d=D();m.atkAnim=.25;P.combatT=0;
  const ch=clamp(75+T.hit-d.flee,25,95)/100;
  if(Math.random()>ch){floatText(P.x,P.y-52,'Miss','#dfe6f5',13);return}
  let dmg=rnd(T.atk[0],T.atk[1])*(1-d.def/(d.def+40));
  if(P.endure>0)dmg*=1-(8+4*S.skills.endure)/100;
  dmg=Math.max(1,Math.round(dmg));
  S.hp-=dmg;P.flash=.25;
  floatText(P.x,P.y-52,String(dmg),'#ff6b6b',17);
  if(S.hp<=0){S.hp=0;die()}
}
function enemiesNear(r){let n=0;for(const m of mons)if(m.state!=='dead'&&dist(P,m)<=r)n++;return n}
function useSkill(id,auto){
  const L=S.skills[id],d=D(),fail=t=>{if(!auto)log(t,'bad');return false};
  if(P.dead)return false;
  if(!L)return fail('You have not learned that skill yet.');
  if(P.skillCd>0)return false;
  const cost=SK[id].cost?SK[id].cost(L):0;
  if(S.sp<cost)return fail('Not enough SP.');
  if(id==='bash'){
    const m=P.target;if(!m||m.state==='dead')return fail('Bash needs a locked-on target.');
    if(dist(P,m)>RANGE+8)return fail('Target is too far away.');
    S.sp-=cost;P.skillCd=.8;P.swing=P.swingMax;P.face=m.x>=P.x?1:-1;
    addFx({k:'slash',x:P.x+P.face*18,y:P.y,face:P.face,dur:.26});
    hitMonster(m,d,{mult:1.3+.3*(L-1),hitBonus:25,col:'#ffe9a8',knock:5});
  }else if(id==='magnum'){
    if(S.hp<=12)return fail('Not enough HP.');
    const hits=mons.filter(m=>m.state!=='dead'&&dist(P,m)<=105);
    if(!hits.length)return fail('No enemies in range.');
    S.sp-=cost;S.hp-=8;P.skillCd=1.2;P.swing=P.swingMax;
    floatText(P.x,P.y-52,'8','#ff6b6b',14);
    addFx({k:'ring',x:P.x,y:P.y,dur:.55,r:110,col:'#ff9a3c'});addFx({k:'ring',x:P.x,y:P.y,dur:.4,r:70,col:'#ffd966'});
    for(const m of hits)hitMonster(m,d,{mult:1.1+.25*L,hitBonus:50,noCrit:true,col:'#ffb26b',knock:26});
  }else if(id==='endure'){
    if(P.endure>0)return fail('Endure is already active.');
    S.sp-=cost;P.skillCd=1;P.endure=10+5*L;
    addFx({k:'ring',x:P.x,y:P.y,dur:.7,r:44,col:'#7fb2f0'});
    log(`Endure active for ${10+5*L} seconds.`,'sys');
  }else return false;
  dirty();return true;
}
function autoSkill(d){
  if(P.skillCd>0)return;
  const K=S.skills;
  if(K.endure>0&&P.endure<=0&&S.sp>=10+(K.bash?SK.bash.cost(K.bash):0)&&S.hp<d.maxHp*.85){if(useSkill('endure',true))return}
  if(K.magnum>0&&enemiesNear(105)>=2&&S.hp>d.maxHp*.4&&S.sp>=20){if(useSkill('magnum',true))return}
  if(K.bash>0&&S.sp>=SK.bash.cost(K.bash))useSkill('bash',true);
}

/* ---------------- items ---------------- */
function addItem(id,n){S.inv[id]=(S.inv[id]||0)+n;dirty()}
function takeItem(id,n){S.inv[id]-=n;if(S.inv[id]<=0)delete S.inv[id];dirty()}
function smartItem(kind){
  const key=kind==='hp'?'heal':'sp';
  const d=D(),miss=kind==='hp'?d.maxHp-S.hp:d.maxSp-S.sp;
  const ids=Object.keys(S.inv).filter(id=>ITEMS[id][key]).sort((a,b)=>ITEMS[a][key]-ITEMS[b][key]);
  if(!ids.length)return null;
  return ids.find(id=>ITEMS[id][key]>=miss*.9)||ids[ids.length-1];
}
function useItem(id,auto){
  const it=ITEMS[id];if(!it||!S.inv[id]||P.dead)return;
  if(P.itemCd>0)return;
  const d=D();
  if(it.heal){
    if(S.hp>=d.maxHp){if(!auto)log('Your HP is already full.','bad');return}
    const h=Math.round(it.heal*(1+S.skills.hprec*.04));
    S.hp=Math.min(d.maxHp,S.hp+h);floatText(P.x,P.y-52,'+'+h,'#7ee08f',16);
    addFx({k:'ring',x:P.x,y:P.y,dur:.5,r:30,col:'#7ee08f'});
  }else if(it.sp){
    if(S.sp>=d.maxSp){if(!auto)log('Your SP is already full.','bad');return}
    S.sp=Math.min(d.maxSp,S.sp+it.sp);floatText(P.x,P.y-52,'+'+it.sp+' SP','#7db2f2',15);
    addFx({k:'ring',x:P.x,y:P.y,dur:.5,r:30,col:'#7db2f2'});
  }else if(it.warp){
    P.x=SPAWN.x;P.y=SPAWN.y;P.target=null;P.dest=null;P.pickup=null;
    for(const m of mons)if(m.state==='chase')m.state='return';
    addFx({k:'pillar',x:P.x,y:P.y,dur:.9});log('You returned to Midgard Town.','sys');
  }
  P.itemCd=.7;takeItem(id,1);
}
function equipItem(id){
  const it=ITEMS[id];if(!it||!isGear(it)||!S.inv[id])return;
  if(S.level<it.lv){log(`You need Base Lv. ${it.lv} to equip ${it.n}.`,'bad');return}
  const old=S.eq[it.k];takeItem(id,1);if(old)addItem(old,1);S.eq[it.k]=id;
  log(`Equipped ${it.n}.`,'sys');clampVitals();dirty();
}
function unequip(slot){const id=S.eq[slot];if(!id)return;S.eq[slot]=null;addItem(id,1);clampVitals();log(`Removed ${ITEMS[id].n}.`,'sys');dirty()}
function clampVitals(){const d=D();S.hp=Math.min(S.hp,d.maxHp);S.sp=Math.min(S.sp,d.maxSp)}
function owned(id){return(S.inv[id]||0)>0||Object.values(S.eq).includes(id)}
function buyItem(id,n){
  const it=ITEMS[id];if(!it||!it.buy)return;
  if(isGear(it)){n=1;if(owned(id)){log(`You already own ${it.n}.`,'bad');return}}
  const cost=it.buy*n;
  if(S.zeny<cost){log('You do not have enough Zeny.','bad');return}
  S.zeny-=cost;addItem(id,n);log(`Bought ${it.n}${n>1?' x'+n:''} for ${fmt(cost)}z.`,'gold');
}
function sellItem(id,n){
  const it=ITEMS[id],have=S.inv[id]||0;if(!it||!have)return;
  n=Math.min(n,have);const g=it.sell*n;
  takeItem(id,n);S.zeny+=g;log(`Sold ${it.n}${n>1?' x'+n:''} for ${fmt(g)}z.`,'gold');
}
function sellAllLoot(){
  let g=0,c=0;
  for(const id of Object.keys(S.inv)){const it=ITEMS[id];if(it.k==='loot'){g+=it.sell*S.inv[id];c+=S.inv[id];delete S.inv[id]}}
  if(!c){log('You have no loot to sell.','bad');return}
  S.zeny+=g;log(`Sold ${c} loot items for ${fmt(g)}z.`,'gold');dirty();
}
function collect(dr){
  const i=drops.indexOf(dr);if(i<0)return;drops.splice(i,1);
  addItem(dr.id,1);log(`Obtained ${ITEMS[dr.id].n}`,'drop');
  floatText(P.x,P.y-52,ITEMS[dr.id].n,'#8fe3ff',12);
  if(P.pickup===dr)P.pickup=null;
}
function addStat(k){
  const v=S.stats[k],cost=1+Math.floor(v/20);
  if(S.statPts<cost||v>=99)return;
  S.statPts-=cost;S.stats[k]++;clampVitals();dirty();
}
function canLearn(id){
  const L=S.skills[id],s=SK[id];
  if(S.skillPts<1||L>=s.max)return false;
  return s.req.every(([r,l])=>S.skills[r]>=l);
}
function learn(id){if(!canLearn(id))return;S.skillPts--;S.skills[id]++;clampVitals();dirty();log(`${SK[id].n} is now Lv. ${S.skills[id]}.`,'lvl')}

/* ---------------- movement ---------------- */
const SPD=150,RANGE=38;
function stepTo(e,tx,ty,sp,dt,stop){
  const dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy);
  if(d<=stop)return false;
  const st=Math.min(sp*dt,d-stop);
  e.x+=dx/d*st;e.y+=dy/d*st;
  if(Math.abs(dx)>2)e.face=dx>0?1:-1;
  return true;
}
function collide(e,rad){
  for(const o of obst){
    const dx=e.x-o.x,dy=e.y-o.y,m=o.r+rad,d2=dx*dx+dy*dy;
    if(d2<m*m){const d=Math.sqrt(d2)||.001;e.x=o.x+dx/d*m;e.y=o.y+dy/d*m}
  }
  e.x=clamp(e.x,30,W-30);e.y=clamp(e.y,40,H-30);
}
function openShop(){ui.shop=true;ui.open=true;ui.tab='shop';ui.confirmReset=false;dirty()}

function updatePlayer(dt){
  if(P.dead){P.deadT+=dt;if(P.deadT>3.2)respawnPlayer();return}
  P.skillCd=Math.max(0,P.skillCd-dt);P.itemCd=Math.max(0,P.itemCd-dt);P.endure=Math.max(0,P.endure-dt);
  P.swing=Math.max(0,P.swing-dt);P.flash=Math.max(0,P.flash-dt);P.combatT+=dt;
  const d=D();
  if(P.target&&(P.target.state==='dead'||P.target.hp<=0))P.target=null;
  if(P.pickup&&!drops.includes(P.pickup))P.pickup=null;
  const px=P.x,py=P.y;let moved=false;
  if(P.target){
    const m=P.target,dd=dist(P,m);
    if(dd>RANGE)moved=stepTo(P,m.x,m.y,SPD,dt,RANGE-6);
    else{
      P.face=m.x>=P.x?1:-1;P.combatT=0;P.atkT-=dt;
      if(S.opts.skill)autoSkill(d);
      if(P.atkT<=0&&P.target){
        P.swing=P.swingMax;P.atkT=d.interval;
        addFx({k:'slash',x:P.x+P.face*18,y:P.y,face:P.face,dur:.2});
        hitMonster(m,d);
      }
    }
  }else if(P.pickup){
    moved=stepTo(P,P.pickup.x,P.pickup.y,SPD,dt,4);
    if(dist(P,P.pickup)<22)collect(P.pickup);
  }else if(P.npc){
    if(dist(P,NPC)>78)moved=stepTo(P,NPC.x,NPC.y+40,SPD,dt,10);
    else{P.npc=false;openShop()}
  }else if(P.dest){
    moved=stepTo(P,P.dest.x,P.dest.y,SPD,dt,3);
    if(!moved)P.dest=null;
  }
  collide(P,8);
  P.moving=moved;
  if(moved){
    const adv=Math.hypot(P.x-px,P.y-py);
    if(adv<SPD*dt*.3)P.stuck+=dt;else P.stuck=0;
    if(P.stuck>.5){P.stuck=0;if(!P.target){P.dest=null;P.pickup=null;P.npc=false}}
  }else P.stuck=0;
  if(P.target)P.atkT=Math.max(P.atkT,-.2);
  if(!P.target&&P.atkT<.3)P.atkT=Math.min(.3,P.atkT+dt);
  // auto loot
  if(S.opts.loot)for(let i=drops.length-1;i>=0;i--){const dr=drops[i];if(dr.t>.4&&dist(P,dr)<66)collect(dr)}
  // auto potion
  if(S.opts.potion&&S.hp<d.maxHp*.35&&P.itemCd<=0){const id=smartItem('hp');if(id)useItem(id,true)}
  // regen
  P.regT+=dt;
  if(P.regT>=3){
    P.regT-=3;const inC=P.combatT<4;
    if(!inC&&S.hp<d.maxHp)S.hp=Math.min(d.maxHp,S.hp+(1+d.maxHp*.008+S.stats.vit*.2+S.skills.hprec*3)*(inTown(P)?2:1));
    if(S.sp<d.maxSp)S.sp=Math.min(d.maxSp,S.sp+(1+d.maxSp*.01+S.stats.int*.15)*(inC?.35:1));
  }
  // shop distance
  if(ui.shop&&dist(P,NPC)>210){ui.shop=false;if(ui.tab==='shop'){ui.tab='items'}dirty()}
}

function updateMon(m,dt){
  const T=m.t;
  m.flash=Math.max(0,m.flash-dt);m.atkAnim=Math.max(0,m.atkAnim-dt);
  if(m.state==='dead'){m.deadT+=dt;if(m.deadT>T.respawn){const p=spawnPos(T.zone,true);m.x=m.hx=p.x;m.y=m.hy=p.y;m.hp=m.maxHp;m.state='idle';m.deadT=0;m.wanderT=1}return}
  const pd=dist(m,P),safe=inTown(P)||P.dead;
  if(m.state!=='chase'&&m.hp<m.maxHp)m.hp=Math.min(m.maxHp,m.hp+m.maxHp*.04*dt);
  if(m.state!=='chase'&&m.state!=='return'&&T.aggro>0&&pd<T.aggro&&!safe)m.state='chase';
  let moved=false;
  if(m.state==='chase'){
    if(safe||dist(m,{x:m.hx,y:m.hy})>T.leash){m.state='return'}
    else if(pd>26){moved=stepTo(m,P.x,P.y,T.cspd,dt,24)}
    else{
      m.face=P.x>=m.x?1:-1;m.atkT-=dt;
      if(m.atkT<=0){m.atkT=T.atkInt;monAttack(m)}
    }
  }
  if(m.state==='return'){
    moved=stepTo(m,m.hx,m.hy,T.cspd,dt,6);
    m.hp=Math.min(m.maxHp,m.hp+m.maxHp*.2*dt);
    if(!moved)m.state='idle';
    else if(T.aggro>0&&pd<T.aggro*.6&&!safe)m.state='chase';
  }
  if(m.state==='idle'){
    m.wanderT-=dt;
    if(m.wanderT<=0){
      if(m.dest||Math.random()<.35){m.dest=null;m.wanderT=rnd(1.5,4)}
      else{const[x0,x1]=ZRECT[T.zone];m.dest={x:clamp(m.x+rnd(-110,110),x0,x1),y:clamp(m.y+rnd(-90,90),150,H-150)};m.wanderT=rnd(2,4)}
    }
    if(m.dest){moved=stepTo(m,m.dest.x,m.dest.y,T.wspd,dt,4);if(!moved)m.dest=null}
  }
  m.moving=moved;
  collide(m,8);
  for(const o of mons){if(o===m||o.state==='dead')continue;const dx=m.x-o.x,dy=m.y-o.y,d=Math.hypot(dx,dy);if(d<20&&d>.01){m.x+=dx/d*(20-d)*.35;m.y+=dy/d*(20-d)*.35}}
}

/* ---------------- sprites ---------------- */
function rr(c,x,y,w,h,r,fs){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();if(fs!==0){c.fill();c.stroke()}}
function circ(c,x,y,r,nostroke){c.beginPath();c.arc(x,y,r,0,7);c.fill();if(!nostroke)c.stroke()}
function ell(c,x,y,rx,ry,nostroke){c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill();if(!nostroke)c.stroke()}
function shadow(c,x,y,rx,ry){c.fillStyle='rgba(20,30,10,.28)';c.beginPath();c.ellipse(x,y,rx,ry,0,0,7);c.fill()}
const iconImgs={};
for(const id in ITEMS){const im=new Image();im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svgOf(ITEMS[id].ic,ITEMS[id].col,48));iconImgs[id]=im}

function drawPlayer(c,t){
  const e=P,mv=e.moving,ph=t*(mv?13:2.5);
  c.save();c.translate(e.x,e.y);shadow(c,0,1,13,5);
  c.lineWidth=1.4;c.strokeStyle=OUT;
  if(e.dead){
    c.rotate(Math.PI/2*e.face);c.translate(0,-4);
    c.fillStyle='#cfc6a6';rr(c,-9,-27,18,18,5);c.fillStyle='#f7d6b4';circ(c,0,-35,9.500);c.fillStyle='#7a4a24';c.beginPath();c.arc(0,-37,9.500,Math.PI,0);c.fill();
    c.strokeStyle=OUT;c.beginPath();c.moveTo(1,-37);c.lineTo(5,-33);c.moveTo(5,-37);c.lineTo(1,-33);c.stroke();
    c.restore();return;
  }
  c.scale(e.face,1);
  if(e.flash>0&&Math.sin(t*60)>0)c.globalAlpha=.6;
  const a=ITEMS[S.eq.armor],w=ITEMS[S.eq.weapon],sh=ITEMS[S.eq.shield];
  const st=mv?Math.sin(ph):0,bob=mv?-Math.abs(Math.sin(ph))*2:Math.sin(ph)*-.8;

/* ---------------- fx / floats ---------------- */
function updateFx(dt){
  for(let i=fx.length-1;i>=0;i--){fx[i].t+=dt;if(fx[i].t>=fx[i].dur)fx.splice(i,1)}
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.t+=dt;if(f.t>=f.dur)floats.splice(i,1)}
  for(let i=drops.length-1;i>=0;i--){drops[i].t+=dt;if(drops[i].t>90)drops.splice(i,1)}
}
function drawFx(c){
  for(const f of fx){
    const p=f.t/f.dur;c.save();c.globalAlpha=Math.max(0,1-p);
    if(f.k==='ring'){c.strokeStyle=f.col;c.lineWidth=4*(1-p)+1;const rad=f.r*p+8;c.beginPath();c.ellipse(f.x,f.y,rad,rad*.55,0,0,7);c.stroke()}

const cv=$('#cv'),ctx=cv.getContext('2d'),mini=$('#mini'),mctx=mini.getContext('2d');
let cssW=800,cssH=500,dpr=1,zoom=1;
const cam={x:0,y:0};
function resize(){
  const r=cv.getBoundingClientRect();cssW=Math.max(100,r.width);cssH=Math.max(100,r.height);
  dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=Math.round(cssW*dpr);cv.height=Math.round(cssH*dpr);
  zoom=clamp(Math.min(cssW/760,cssH/520),.85,1.5);
}
const mouse={x:0,y:0,on:false};
function hoverMon(){
  if(!mouse.on)return null;
  return pickMonster(mouse);
}
function render(t,dt){
  const vw=cssW/zoom,vh=cssH/zoom;
  const tx=clamp(P.x-vw/2,0,Math.max(0,W-vw)),ty=clamp(P.y-vh/2-10,0,Math.max(0,H-vh));
  const k=1-Math.exp(-dt*9);
  cam.x+=(tx-cam.x)*k;cam.y+=(ty-cam.y)*k;
  ctx.setTransform(dpr*zoom,0,0,dpr*zoom,-cam.x*dpr*zoom,-cam.y*dpr*zoom);
  ctx.clearRect(cam.x,cam.y,vw+2,vh+2);
  const sx=Math.max(0,Math.floor(cam.x)),sy=Math.max(0,Math.floor(cam.y)),sw=Math.min(W-sx,Math.ceil(vw)+3),sh=Math.min(H-sy,Math.ceil(vh)+3);
  ctx.drawImage(mapC,sx,sy,sw,sh,sx,sy,sw,sh);
  const x0=cam.x-90,x1=cam.x+vw+90,y0=cam.y-130,y1=cam.y+vh+90;
  const hov=hoverMon();
  // ground rings
  const ring=(m,col)=>{ctx.strokeStyle=col;ctx.lineWidth=2.200;ctx.beginPath();ctx.ellipse(m.x,m.y,m.t.sr+5,(m.t.sr+5)*.42,0,0,7);ctx.stroke()};
  if(P.target)ring(P.target,'#ff5a5a');else if(hov&&hov!==P.target)ring(hov,'rgba(255,255,255,.85)');
  const list=[];
  for(const p of props)if(p.x>x0&&p.x<x1&&p.y>y0&&p.y<y1)list.push(p);
  for(const m of mons)if(m.x>x0&&m.x<x1&&m.y>y0&&m.y<y1&&(m.state!=='dead'||m.deadT<.7))list.push(m);
  for(const d of drops)if(d.x>x0&&d.x<x1&&d.y>y0&&d.y<y1)list.push(d);
  list.push(P);list.push(NPC);
  list.sort((a,b)=>a.y-b.y);
  for(const e of list){
    if(e.k==='prop')drawProp(ctx,e,t);else if(e.k==='mon')drawMon(ctx,e,t);else if(e.k==='drop')drawDrop(ctx,e,t);
    else if(e.k==='player')drawPlayer(ctx,t);else drawNpc(ctx,t);
  }
  drawFx(ctx);
  // labels / bars
  for(const m of mons){
    if(m.state==='dead'||m.x<x0||m.x>x1||m.y<y0||m.y>y1)continue;
    const T=m.t,top=m.y-T.h-12;
    if(m.hp<m.maxHp||m===P.target)hpBar(ctx,m.x,top,36,m.hp/m.maxHp);
    if(m===P.target||m===hov)label(ctx,`${T.name}  Lv.${T.lvl}`,m.x,top-5,T.aggro?'#ffb0a8':'#fff');
  }
  label(ctx,'Tool Dealer',NPC.x,NPC.y-60,'#ffe08a');
  if(P.endure>0){ctx.strokeStyle='rgba(127,178,240,.9)';ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(P.x,P.y,18,8,0,0,7);ctx.stroke()}
  drawFloats(ctx);
  renderMini();
}
const MMON={slime:'#5fe8c8',cat:'#c6f04d',rat:'#ff6a5a'};
function renderMini(){
  mctx.drawImage(miniBmp,0,0);
  for(const m of mons){if(m.state==='dead')continue;mctx.fillStyle=MMON[m.key];mctx.fillRect(m.x/10-2,m.y/10-2,4,4)}
  mctx.fillStyle='#ffd966';mctx.fillRect(NPC.x/10-3,NPC.y/10-3,6,6);
  mctx.strokeStyle='rgba(255,255,255,.7)';mctx.lineWidth=1.500;mctx.strokeRect(cam.x/10,cam.y/10,cssW/zoom/10,cssH/zoom/10);
  mctx.fillStyle='#fff';mctx.strokeStyle='#000';mctx.lineWidth=1.500;mctx.beginPath();mctx.arc(P.x/10,P.y/10,3.600,0,7);mctx.fill();mctx.stroke();
}

/* ---------------- hud & panel ---------------- */
const cache={};
function setT(id,v){if(cache[id]!==v){cache[id]=v;$(id).textContent=v}}
function setW(id,p){const v=(clamp(p,0,1)*100).toFixed(1)+'%';if(cache[id]!==v){cache[id]=v;$(id).style.width=v}}
const SLOTS=[{key:'1',skill:'bash'},{key:'2',skill:'magnum'},{key:'3',skill:'endure'},{key:'4',kind:'hp'},{key:'5',kind:'sp'}];
const hotbar=$('#hotbar');
hotbar.innerHTML=SLOTS.map((s,i)=>`<button class="slot" data-slot="${i}"><span class="k">${s.key}</span><span class="ic"></span><span class="q"></span><span class="cd"></span></button>`).join('');
const slotEls=[...hotbar.children].map(el=>({el,ic:el.querySelector('.ic'),q:el.querySelector('.q'),cd:el.querySelector('.cd'),icKey:'',title:''}));
function updateHud(){
  const d=D();
  setT('#b-lv','Base Lv. '+S.level);
  setT('#b-hpt',`${Math.ceil(S.hp)} / ${d.maxHp}`);setW('#b-hpf',S.hp/d.maxHp);
  setT('#b-spt',`${Math.floor(S.sp)} / ${d.maxSp}`);setW('#b-spf',S.sp/d.maxSp);
  if(S.level>=CAP){setT('#b-xpt','MAX');setW('#b-xpf',1)}else{const n=need(S.level);setT('#b-xpt',(S.exp/n*100).toFixed(1)+'%');setW('#b-xpf',S.exp/n)}
  setT('#b-z',fmt(S.zeny)+' z');
  const tg=P.target,tEl=$('#target');
  if(tg&&tg.state!=='dead'){
    tEl.classList.add('show');setT('#t-name',tg.t.name);setT('#t-lv','Lv. '+tg.t.lvl);
    setT('#t-hpt',`${Math.ceil(tg.hp)} / ${tg.maxHp}`);setW('#t-hpf',tg.hp/tg.maxHp);
  }else tEl.classList.remove('show');
  $('#dot-status').classList.toggle('show',S.statPts>0);
  $('#dot-skills').classList.toggle('show',S.skillPts>0&&SKORDER.some(canLearn));
  document.querySelectorAll('.chip').forEach(c=>c.classList.toggle('on',!!S.opts[c.dataset.opt]));
  SLOTS.forEach((s,i)=>{
    const e=slotEls[i];let icKey,q='',off=false,cdp=0,title='';
    if(s.skill){
      const L=S.skills[s.skill],sk=SK[s.skill];icKey=s.skill;
      off=!L||S.sp<sk.cost(L||1);cdp=P.skillCd>0?P.skillCd/(s.skill==='magnum'?1.2:s.skill==='endure'?1:.8):0;
      title=`${sk.n}${L?' Lv.'+L:' (not learned)'} — key ${s.key}`;
      if(s.skill==='endure'&&P.endure>0)q=Math.ceil(P.endure)+'s';
    }else{
      const id=smartItem(s.kind);icKey=id||(s.kind==='hp'?'red_potion':'blue_potion');off=!id;
      q=id?String(S.inv[id]):'';title=id?`${ITEMS[id].n} — key ${s.key}`:`No ${s.kind==='hp'?'HP':'SP'} items`;
    }
    if(e.icKey!==icKey){e.icKey=icKey;e.ic.innerHTML=s.skill?svgOf(icKey,'#fff',32):iconOf(icKey,32)}
    if(e.title!==title){e.title=title;e.el.title=title}
    e.el.classList.toggle('off',off);
    if(e.q.textContent!==q)e.q.textContent=q;
    e.cd.style.height=(clamp(cdp,0,1)*100).toFixed(0)+'%';
  });
}
const cap=s=>s[0].toUpperCase()+s.slice(1);
function statLine(it){
  if(it.k==='weapon')return`ATK +${it.atk} · Req. Lv ${it.lv}`;
  if(isGear(it))return`DEF +${it.def} · Req. Lv ${it.lv}`;
  if(it.k==='loot')return`Sells for ${it.sell}z`;
  if(it.heal)return`Restores ${it.heal} HP`;
  if(it.sp)return`Restores ${it.sp} SP`;
  if(it.warp)return'Teleports you to Midgard Town';
  return'';
}
const row=o=>`<div class="row"><div class="ric">${o.ic}</div><div class="rin"><b>${o.name}</b><span>${o.sub||''}</span></div><div class="rac">${o.right||''}</div></div>`;
function tabItems(){
  let h='<div class="sect">Equipped</div>';
  for(const sl of['weapon','armor','shield']){
    const id=S.eq[sl],it=ITEMS[id];
    h+=row({ic:it?iconOf(id,24):svgOf('empty','#9fb2d3',24),name:it?it.n:`<span class="mut">${cap(sl)} (empty)</span>`,sub:it?statLine(it):'',right:it?`<button class="btn" data-act="unequip" data-id="${sl}">Remove</button>`:''});
  }
  const groups=[['Consumables',it=>it.k==='use'],['Loot',it=>it.k==='loot'],['Gear',isGear]];
  let any=false;
  for(const[title,f]of groups){
    const ids=Object.keys(S.inv).filter(id=>f(ITEMS[id])).sort((a,b)=>ITEMS[a].n.localeCompare(ITEMS[b].n));
    if(!ids.length)continue;any=true;h+=`<div class="sect">${title}</div>`;
    for(const id of ids){
      const it=ITEMS[id];let btn='';
      if(it.k==='use')btn=`<button class="btn pri" data-act="use" data-id="${id}">Use</button>`;
      else if(isGear(it))btn=`<button class="btn pri" data-act="equip" data-id="${id}" ${S.level<it.lv?'disabled':''}>Equip</button>`;
      h+=row({ic:iconOf(id,24),name:`${it.n} <span class="mut">x${S.inv[id]}</span>`,sub:statLine(it),right:btn});
    }
  }
  if(!any)h+='<p class="mut" style="margin:14px 2px">Your bag is empty. Defeat monsters to collect drops, then sell them to the Tool Dealer in town.</p>';
  return h;
}
function tabStatus(){
  const d=D(),n=S.level>=CAP?1:need(S.level);
  const info=[['str','STR','Raises ATK'],['agi','AGI','Flee and attack speed'],['vit','VIT','Max HP and DEF'],['int','INT','Max SP and SP regen'],['dex','DEX','Hit rate and ATK'],['luk','LUK','Critical chance and drop rate']];
  let h=`<div class="card"><div class="nm"><span>${S.name||'Hero'} · Swordsman</span><small>Base Lv. ${S.level}</small></div>
   <div class="bar xp" style="margin-top:5px"><i style="width:${S.level>=CAP?100:S.exp/n*100}%"></i><b>${S.level>=CAP?'MAX LEVEL':fmt(S.exp)+' / '+fmt(n)+' Exp'}</b></div></div>`;
  h+=`<div class="pts"><span>Status points</span><b>${S.statPts}</b></div>`;
  for(const[k,l,hint]of info){
    const v=S.stats[k],cost=1+Math.floor(v/20);
    h+=`<div class="stat"><b>${l}</b><em>${v}</em><span>${hint}</span><button class="btn pri" data-act="stat" data-id="${k}" ${S.statPts<cost||v>=99?'disabled':''}>+ ${cost} pt</button></div>`;
  }
  h+=`<div class="sect">Combat</div><div class="grid2">
   <div>ATK<b>${Math.round(d.atk*.9)}–${Math.round(d.atk*1.1)}</b></div><div>DEF<b>${d.def}</b></div>
   <div>HIT<b>${d.hit}</b></div><div>FLEE<b>${Math.round(d.flee)}</b></div>
   <div>CRIT<b>${d.crit.toFixed(1)}%</b></div><div>Attack delay<b>${d.interval.toFixed(2)}s</b></div>
   <div>Max HP<b>${d.maxHp}</b></div><div>Max SP<b>${d.maxSp}</b></div>
   <div>Monsters slain<b>${fmt(S.kills)}</b></div><div>Zeny<b>${fmt(S.zeny)}z</b></div></div>`;
  h+=`<div class="foot">${ui.confirmReset?`<button class="btn bad" data-act="reset2">Yes, erase my save</button>&nbsp;<button class="btn" data-act="reset0">Cancel</button>`:`<button class="btn" data-act="reset1">New game</button>`}</div>`;
  return h;
}
function tabSkills(){
  let h=`<div class="pts"><span>Skill points</span><b>${S.skillPts}</b></div>`;
  for(const id of SKORDER){
    const s=SK[id],L=S.skills[id];
    const reqTxt=s.req.filter(([r,l])=>S.skills[r]<l).map(([r,l])=>`${SK[r].n} Lv ${l}`).join(', ');
    const pips=Array.from({length:s.max},(_,i)=>`<i class="${i<L?'f':''}"></i>`).join('');
    h+=`<div class="row" style="align-items:start"><div class="ric" style="width:34px;height:34px">${svgOf(id,'#fff',28)}</div>
      <div class="rin"><b style="white-space:normal">${s.n}<span class="tag ${s.t}">${s.t==='a'?'ACTIVE':'PASSIVE'}</span></b><div class="pips">${pips}</div>
      <span>${s.desc(Math.max(1,L))}</span>${reqTxt?`<span class="warn">Requires ${reqTxt}</span>`:''}</div>
      <div class="rac"><button class="btn pri" data-act="skill" data-id="${id}" ${canLearn(id)?'':'disabled'}>${L>=s.max?'Max':'+'}</button></div></div>`;
  }
  h+='<p class="mut" style="font-size:11.5px;margin-top:10px">Hotkeys 1–3 use your active skills. Auto skills (below the screen) lets them fire on their own during a fight.</p>';
  return h;
}
function tabShop(){
  let h='<div class="greet"><b>Tool Dealer</b><br>Potions, blades and armor, all fairly priced. I buy whatever you looted, too.</div>';
  h+=`<div class="pts"><span>Your Zeny</span><b>${fmt(S.zeny)} z</b></div>`;
  h+=`<div class="seg"><button class="btn ${ui.shopTab==='buy'?'on':''}" data-act="shoptab" data-id="buy">Buy</button><button class="btn ${ui.shopTab==='sell'?'on':''}" data-act="shoptab" data-id="sell">Sell</button></div>`;
  if(ui.shopTab==='buy'){
    for(const id of SHOP){
      const it=ITEMS[id],gear=isGear(it),has=gear&&owned(id);
      let bt;
      if(has)bt='<span class="mut">Owned</span>';
      else bt=`<div class="bt"><button class="btn pri" data-act="buy" data-id="${id}" data-n="1" ${S.zeny<it.buy?'disabled':''}>Buy</button>${gear?'':`<button class="btn" data-act="buy" data-id="${id}" data-n="10" ${S.zeny<it.buy*10?'disabled':''}>x10</button>`}</div>`;
      h+=row({ic:iconOf(id,24),name:it.n,sub:statLine(it)+(gear&&S.level<it.lv?' <span class="warn">(level too low)</span>':''),right:`<span class="pr">${fmt(it.buy)} z</span>${bt}`});
    }
  }else{
    const ids=Object.keys(S.inv).sort((a,b)=>ITEMS[a].k.localeCompare(ITEMS[b].k)||ITEMS[a].n.localeCompare(ITEMS[b].n));
    const total=ids.filter(id=>ITEMS[id].k==='loot').reduce((s,id)=>s+ITEMS[id].sell*S.inv[id],0);
    h+=`<button class="btn pri" style="width:100%;margin-bottom:6px" data-act="sellloot" ${total?'':'disabled'}>Sell all loot${total?' (+'+fmt(total)+' z)':''}</button>`;
    if(!ids.length)h+='<p class="mut">You have nothing to sell.</p>';
    for(const id of ids){
      const it=ITEMS[id];
      h+=row({ic:iconOf(id,24),name:`${it.n} <span class="mut">x${S.inv[id]}</span>`,sub:`${fmt(it.sell)} z each`,right:`<div class="bt"><button class="btn pri" data-act="sell" data-id="${id}" data-n="1">Sell 1</button>${S.inv[id]>1?`<button class="btn" data-act="sell" data-id="${id}" data-n="999">All</button>`:''}</div>`});
    }
    h+='<p class="mut" style="font-size:11.5px;margin-top:8px">Equipped gear is not listed. Remove it in the Items tab first.</p>';
  }
  return h;
}
const panel=$('#panel'),pbody=$('#pbody'),tabsEl=$('#tabs');
const TITLES={items:'Items',status:'Status',skills:'Skills',shop:'Tool Dealer'};
function renderPanel(){
  ui.dirty=false;
  panel.classList.toggle('open',ui.open);
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.toggle('on',ui.open&&b.dataset.tab===ui.tab));
  if(!ui.open)return;
  if(ui.tab==='shop'&&!ui.shop)ui.tab='items';
  const tabs=['items','status','skills'].concat(ui.shop?['shop']:[]);
  tabsEl.innerHTML=tabs.map(t=>`<button class="tab ${t===ui.tab?'on':''}" data-act="tab" data-id="${t}">${TITLES[t]==='Tool Dealer'?'Shop':TITLES[t]}${t==='status'&&S.statPts>0?'<i class="dot show"></i>':''}${t==='skills'&&S.skillPts>0&&SKORDER.some(canLearn)?'<i class="dot show"></i>':''}</button>`).join('');
  $('#p-title').textContent=TITLES[ui.tab];
  const sc=pbody.scrollTop;
  pbody.innerHTML=ui.tab==='items'?tabItems():ui.tab==='status'?tabStatus():ui.tab==='skills'?tabSkills():tabShop();
  pbody.scrollTop=sc;
}
function openTab(t){
  if(ui.open&&ui.tab===t){ui.open=false;ui.shop=false}else{ui.open=true;ui.tab=t;ui.confirmReset=false}
  ui.dirty=true;
}
panel.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,id=b.dataset.id,n=parseInt(b.dataset.n||'1',10);
  if(a==='close'){ui.open=false;ui.shop=false;ui.dirty=true;return}
  if(a==='tab'){ui.tab=id;ui.confirmReset=false;ui.dirty=true;return}
  if(a==='use')useItem(id);
  else if(a==='equip')equipItem(id);
  else if(a==='unequip')unequip(id);
  else if(a==='stat')addStat(id);
  else if(a==='skill')learn(id);
  else if(a==='buy')buyItem(id,n);
  else if(a==='sell')sellItem(id,n);
  else if(a==='sellloot')sellAllLoot();
  else if(a==='shoptab'){ui.shopTab=id}
  else if(a==='reset1')ui.confirmReset=true;
  else if(a==='reset0')ui.confirmReset=false;
  else if(a==='reset2'){newGame();return}
  ui.dirty=true;
});
document.querySelectorAll('.mbtn').forEach(b=>b.addEventListener('click',()=>openTab(b.dataset.tab)));
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{S.opts[c.dataset.opt]=!S.opts[c.dataset.opt];dirty()}));
function slotAct(i){
  const s=SLOTS[i];if(!s)return;
  if(s.skill)useSkill(s.skill);
  else{const id=smartItem(s.kind);if(id)useItem(id);else log(`You have no ${s.kind==='hp'?'HP':'SP'} items.`,'bad')}
}
hotbar.addEventListener('click',e=>{const b=e.target.closest('.slot');if(b)slotAct(+b.dataset.slot)});
$('#reviveBtn').addEventListener('click',()=>{if(P.dead)respawnPlayer()});
window.addEventListener('keydown',e=>{
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k>='1'&&k<='5')slotAct(+k-1);
  else if(k==='i')openTab('items');else if(k==='c')openTab('status');else if(k==='k')openTab('skills');
  else if(k==='escape'){if(ui.open){ui.open=false;ui.shop=false;ui.dirty=true}else{P.target=null;P.dest=null;P.pickup=null;P.npc=false}}
});

/* ---------------- input ---------------- */
function toWorld(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/zoom+cam.x,y:(e.clientY-r.top)/zoom+cam.y}}
function pickMonster(w){
  let best=null,bd=1e9;
  for(const m of mons){
    if(m.state==='dead')continue;
    const d=Math.hypot(w.x-m.x,w.y-(m.y-m.t.h*.5));
    if(d<m.t.pr&&d<bd){bd=d;best=m}
  }
  return best;
}
let down=false,downGround=false;
cv.addEventListener('pointerdown',e=>{
  if(P.dead)return;
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  const w=toWorld(e);mouse.x=w.x;mouse.y=w.y;mouse.on=e.pointerType==='mouse';
  down=true;downGround=false;
  const m=pickMonster(w);
  if(m){P.target=m;P.dest=null;P.pickup=null;P.npc=false;return}
  if(Math.hypot(w.x-NPC.x,w.y-(NPC.y-22))<34||Math.hypot(w.x-NPC.x,w.y-884)<46){P.npc=true;P.target=null;P.dest=null;P.pickup=null;return}
  let dr=null,bd=30;for(const d of drops){const q=Math.hypot(w.x-d.x,w.y-(d.y-10));if(q<bd){bd=q;dr=d}}
  if(dr){P.pickup=dr;P.target=null;P.dest=null;P.npc=false;return}
  P.target=null;P.pickup=null;P.npc=false;downGround=true;
  P.dest={x:clamp(w.x,30,W-30),y:clamp(w.y,40,H-30)};
  addFx({k:'click',x:P.dest.x,y:P.dest.y,dur:.4});
});
cv.addEventListener('pointermove',e=>{
  const w=toWorld(e);mouse.x=w.x;mouse.y=w.y;mouse.on=e.pointerType==='mouse';
  if(down&&downGround&&!P.dead&&!P.target)P.dest={x:clamp(w.x,30,W-30),y:clamp(w.y,40,H-30)};
  if(mouse.on){
    const m=pickMonster(w);
    const npc=Math.hypot(w.x-NPC.x,w.y-(NPC.y-22))<34||Math.hypot(w.x-NPC.x,w.y-884)<46;
    cv.style.cursor=m?'crosshair':npc?'pointer':'default';
  }
});
const up=()=>{down=false};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('pointerleave',()=>{mouse.on=false});

/* ---------------- game flow ---------------- */
let curZone='';
const bannerEl=$('#banner');let bannerT=0;
function showBanner(z){bannerEl.innerHTML=`<b>${z.n}</b><span>${z.sub}</span>`;bannerEl.classList.add('show');clearTimeout(bannerT);bannerT=setTimeout(()=>bannerEl.classList.remove('show'),2800)}
function newGame(){
  try{localStorage.removeItem(SAVE_KEY)}catch(e){}
  S=fresh();const d=D();S.hp=d.maxHp;S.sp=d.maxSp;
  P.x=SPAWN.x;P.y=SPAWN.y;P.target=null;P.dest=null;P.pickup=null;P.npc=false;P.dead=false;P.endure=0;
  $('#dead').classList.remove('show');
  drops.length=0;fx.length=0;floats.length=0;initMons();
  ui.open=false;ui.shop=false;ui.confirmReset=false;ui.tab='items';curZone='';
  log('A new adventure begins.','sys');dirty();
}
function update(dt,t){
  updatePlayer(dt);
  for(const m of mons)updateMon(m,dt);
  updateFx(dt);
  const z=zoneAt(P.x);if(z.id!==curZone){curZone=z.id;showBanner(z)}
}
let last=performance.now(),gt=0,lastSave=0,lastHud=0;
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;gt+=dt;
  update(dt,gt);render(gt,dt);
  lastHud+=dt;if(lastHud>.05){lastHud=0;updateHud()}
  if(ui.dirty&&now-ui.last>60){ui.last=now;renderPanel()}
  if(now-lastSave>4000){lastSave=now;save()}
  requestAnimationFrame(frame);
}
buildMap();
const saved=load();
initMons();
if(saved){
  P.x=clamp(saved.x||SPAWN.x,30,W-30);P.y=clamp(saved.y||SPAWN.y,40,H-30);
  if(!(S.hp>0)){const d=D();S.hp=d.maxHp;S.sp=d.maxSp}
  clampVitals();
  log('Welcome back to Midgard Fields.','sys');
}else{
  const d=D();S.hp=d.maxHp;S.sp=d.maxSp;
  log('Welcome to Midgard Fields.','sys');
  log('Click the ground to walk. Click a monster to lock on and fight.','sys');
  log('Press K to spend your skill point, C for status points.','lvl');
}
new ResizeObserver(resize).observe($('#stage'));
resize();cam.x=clamp(P.x-cssW/zoom/2,0,W);cam.y=clamp(P.y-cssH/zoom/2,0,H);
window.addEventListener('pagehide',()=>{saveDirty=true;save()});
document.addEventListener('visibilitychange',()=>{if(document.hidden){saveDirty=true;save()}});
requestAnimationFrame(frame);
})();
</script>
</body></html>
